<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ISOTEC Zeichentool</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="kopf">
    <div class="marke"><span class="punkt"></span><span class="marke-text">ISOTEC Zeichentool</span></div>

    <div class="gruppe">
      <input type="file" id="datei-input" accept="application/pdf,image/*" multiple hidden />
      <button class="btn" id="btn-oeffnen" title="PDF oder Bild öffnen">PDF öffnen</button>
      <button class="btn" id="btn-leer" title="Ein weiteres leeres A4-Blatt hinten anhängen. Das bestehende Dokument bleibt erhalten.">+ Blatt</button>
      <button class="btn" id="btn-foto" title="Ein Foto auf die aktuelle Seite setzen (oder Datei aufs Blatt ziehen, oder Strg+V). Es wird nichts ersetzt.">+ Foto</button>
    </div>

    <div class="gruppe">
      <button class="btn hand" id="btn-auswahl" title="Hand: Objekte greifen, verschieben, an den Punkten anpassen (V, Rechtsklick oder Esc)">✋ Hand</button>
      <button class="btn ikon gefahr" id="btn-loeschen" title="Markierte Objekte löschen (Entf)">🗑</button>
      <button class="btn" id="btn-lasso" title="Lasso: Bereich einkreisen, alle Objekte darin gemeinsam verschieben oder skalieren (L)">⭕ Lasso</button>
      <button class="btn" id="btn-gruppe" title="Markierte Objekte zu einer Gruppe verbinden, die sich gemeinsam greifen lässt (G)" disabled>⧉ Gruppe</button>
      <span class="trenner"></span>
      <button class="btn ikon" id="btn-undo" title="Rückgängig (Strg+Z)">↺</button>
      <button class="btn ikon" id="btn-redo" title="Wiederholen (Strg+Y)">↻</button>
    </div>

    <div class="gruppe">
      <button class="btn ikon" id="btn-zoom-minus" title="Verkleinern (Strg+Mausrad)">−</button>
      <span class="zoom-wert" id="zoom-wert">100 %</span>
      <button class="btn ikon" id="btn-zoom-plus" title="Vergrößern (Strg+Mausrad)">+</button>
      <button class="btn" id="btn-seite" title="Ganze Seite anzeigen">Seite</button>
      <span class="trenner"></span>
      <button class="btn primaer" id="btn-speichern" title="Als PDF speichern (Strg+S)">Speichern</button>
    </div>
  </header>

  <main class="buehne">
    <aside class="seiten-leiste">
      <div class="leiste-titel">Seiten</div>
      <div class="miniaturen" id="miniaturen"></div>
    </aside>

    <section class="ansicht" id="ansicht">
      <div class="start" id="start">
        <div class="start-karte">
          <h1>Zeichnen und markieren im PDF</h1>
          <p>PDF hierher ziehen, Fotos per Drag &amp; Drop oder Strg+V einfügen.</p>
          <div class="start-knoepfe">
            <button class="btn primaer gross" id="btn-oeffnen-2">PDF öffnen</button>
            <button class="btn gross" id="btn-leer-2">Leeres Blatt A4</button>
          </div>
        </div>
      </div>
      <div class="seiten" id="seiten"></div>
    </section>

    <aside class="vorlagen-leiste" id="vorlagen-leiste">
      <div class="leiste-kopf">
        <span class="leiste-name">Vorlagen</span>
        <button class="leiste-knopf" id="btn-einstellung" title="Strichdicke oder Schriftgröße der gewählten Vorlage anpassen">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/></svg>
        </button>
        <button class="leiste-knopf" id="btn-fixieren" title="Leiste offen halten. Ohne Fixierung klappt sie nach der Wahl einer Vorlage zu.">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M6 2h4l-.6 3.4 2.1 2.1H4.5l2.1-2.1z"/><path d="M8 7.5V14"/></svg>
        </button>
        <button class="leiste-knopf" id="btn-zuklappen" title="Leiste einklappen">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5L9.5 8 5 12.5M10.5 3.5v9"/></svg>
        </button>
      </div>
      <div class="reiter" id="reiter">
        <button class="reiter-knopf aktiv" data-reiter="gewerke">Gewerke</button>
        <button class="reiter-knopf" data-reiter="aufmass">Aufmaß</button>
        <button class="reiter-knopf" data-reiter="grundriss">Grundriss</button>
      </div>
      <div class="vorlagen" id="vorlagen"></div>
      <button class="leiste-auf" id="btn-aufklappen" title="Vorlagen einblenden">« Vorlagen</button>
      <div class="einstellungen" id="einstellungen" hidden></div>
    </aside>
  </main>

  <div class="status" id="status">Bereit</div>
  <div class="ablage-hinweis"><span>Datei hier ablegen</span></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
